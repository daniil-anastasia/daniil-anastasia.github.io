<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Даниил и Анастасия</title>
<meta name="description" content="Приглашение на свадьбу Даниила и Анастасии.">
<meta name="theme-color" content="#120A0C">
<meta property="og:type" content="website">
<meta property="og:title" content="Даниил и Анастасия">
<meta property="og:description" content="Приглашение на свадьбу.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap">

<link rel="stylesheet" href="css/base.css?v=11">
<link rel="stylesheet" href="css/components.css?v=11">
<link rel="stylesheet" href="css/sections.css?v=16">
</head>

<body class="is-loading">
<a class="skip-link" href="#main">Перейти к содержанию</a>

<!-- ============ 1. ПЕРВЫЙ ЭКРАН · сцена ============ -->
<div class="stage-wrap" id="top">
  <section class="stage" aria-label="Даниил и Анастасия">
    <div class="stage__veil" aria-hidden="true"></div>

    <div class="stage__photos">
      <div class="polaroid polaroid--a" data-polaroid="bride">
        <figure class="polaroid__inner">
          <span class="polaroid__window"><img alt="" decoding="async" fetchpriority="high"></span>
          <figcaption class="polaroid__caption"></figcaption>
        </figure>
      </div>
      <div class="polaroid polaroid--b" data-polaroid="groom">
        <figure class="polaroid__inner">
          <span class="polaroid__window"><img alt="" decoding="async" fetchpriority="high"></span>
          <figcaption class="polaroid__caption"></figcaption>
        </figure>
      </div>
    </div>

    <div class="stage__words">
      <p class="stage__line" data-hero-lines></p>
      <p class="stage__date" data-field="hero.date"></p>
    </div>

    <div class="stage__cue" aria-hidden="true">
      <span class="stage__cue-text" data-field="hero.hint"></span>
      <span class="stage__cue-rule"></span>
    </div>
  </section>
</div>

<main class="paper" id="main">

  <!-- ============ 2. ПРИГЛАШЕНИЕ ============ -->
  <section class="section section--invite" id="invitation" data-section="invitation"
           data-requires="invitation.title|invitation.body">
    <div class="wrap">
      <p class="eyebrow reveal" data-field="invitation.eyebrow"></p>
      <h1 class="invite__title display reveal-lines" data-field="invitation.title"></h1>
      <div class="invite__body">
        <div class="rich reveal" data-list="invitation.body"></div>
        <p class="invite__sign reveal" data-field="invitation.signature"></p>
      </div>
      <div class="invite__media" data-photo="invitation.photo"></div>
    </div>
  </section>

  <!-- ============ 3. ДАНИИЛ И АНАСТАСИЯ ============ -->
  <section class="section section--names" id="names" data-section="names"
           data-requires="couple.groom.name|couple.bride.name">
    <div class="wrap names">
      <p class="eyebrow reveal" data-field="names.eyebrow"></p>

      <div class="names__type">
        <span class="names__one display reveal-lines" data-field="couple.groom.name"></span>
        <span class="names__amp" aria-hidden="true">&amp;</span>
        <span class="names__two display reveal-lines" data-field="couple.bride.name"></span>
      </div>

      <div class="names__media" data-names-media></div>
      <p class="names__note reveal" data-field="names.note"></p>
    </div>
  </section>

  <!-- полноширинный кадр-передышка -->
  <section class="band" data-band="0" aria-hidden="true"></section>

  <!-- ============ 4. ИСТОРИЯ ПАРЫ ============ -->
  <section class="section section--story" id="story" data-section="story" data-requires="story.items">
    <div class="wrap">
      <header class="head">
        <p class="eyebrow reveal" data-field="story.eyebrow"></p>
        <h2 class="head__title display reveal-lines" data-field="story.title"></h2>
      </header>
      <ol class="story" data-story></ol>
    </div>
  </section>

  <!-- ============ 5. ФОТОГРАФИИ ============ -->
  <section class="section section--gallery" id="gallery" data-section="gallery" data-requires="gallery.photos">
    <div class="wrap">
      <header class="head head--split">
        <p class="eyebrow reveal" data-field="gallery.eyebrow"></p>
        <h2 class="head__title display reveal-lines" data-field="gallery.title"></h2>
      </header>
    </div>
    <div class="gallery" data-gallery></div>
  </section>

  <!-- Блок «Детали дня» убран по правке: время сбора и адреса
       теперь живут в программе и в локациях. -->

  <!-- ============ 7. ПРОГРАММА ============ -->
  <section class="section section--schedule" id="schedule" data-section="schedule" data-requires="schedule.items">
    <div class="wrap">
      <header class="head">
        <p class="eyebrow reveal" data-field="schedule.eyebrow"></p>
        <h2 class="head__title display reveal-lines" data-field="schedule.title"></h2>
      </header>
      <div class="schedule__media" data-photo="schedule.photo"></div>
      <ol class="timeline" data-schedule></ol>
    </div>
  </section>

  <!-- ============ 8. ЛОКАЦИИ ============ -->
  <section class="section section--places" id="places" data-section="locations"
           data-requires="locations.ceremony.name|locations.restaurant.name">
    <div class="wrap">
      <header class="head">
        <p class="eyebrow reveal" data-field="locations.eyebrow"></p>
        <h2 class="head__title display reveal-lines" data-field="locations.title"></h2>
      </header>
      <div class="places" data-places></div>
    </div>
  </section>

  <!-- ============ 9. DRESS CODE ============ -->
  <section class="section section--dress" id="dresscode" data-section="dressCode"
           data-requires="dressCode.title|dressCode.description|dressCode.groups|dressCode.colors">
    <div class="wrap">
      <header class="head head--split">
        <p class="eyebrow reveal" data-field="dressCode.eyebrow"></p>
        <h2 class="head__title display reveal-lines" data-field="dressCode.title"></h2>
      </header>
      <div class="dress">
        <div class="dress__text">
          <p class="dress__lead reveal" data-field="dressCode.subtitle"></p>
          <div class="rich reveal" data-list="dressCode.description"></div>
        </div>
        <div class="dress__palette" data-palette></div>
      </div>
      <div class="dress__looks" data-dress-looks></div>
      <div class="dress__lists" data-dress-lists></div>
    </div>
  </section>

  <!-- ============ 12. СЧЁТЧИК ============ -->
  <section class="section section--count" id="countdown" data-section="countdown" data-requires="countdown.enabled">
    <div class="wrap">
      <p class="eyebrow reveal" data-field="countdown.eyebrow"></p>
      <h2 class="count__title display reveal-lines" data-field="countdown.title"></h2>
      <div class="count" data-countdown></div>
      <div class="count__action reveal">
        <a class="btn btn--line" href="assets/wedding-date.ics" download>Сохранить дату</a>
      </div>
    </div>
  </section>

  <!-- ============ 13. ПОЖЕЛАНИЯ ============ -->
  <section class="section section--gifts" id="gifts" data-section="gifts" data-requires="gifts.enabled">
    <div class="wrap">
      <header class="head">
        <p class="eyebrow reveal" data-field="gifts.eyebrow"></p>
        <h2 class="head__title display reveal-lines" data-field="gifts.title"></h2>
      </header>
      <div class="gifts">
        <div class="rich reveal" data-list="gifts.text"></div>
        <div class="gifts__details reveal" data-gifts-details></div>
      </div>
    </div>
  </section>

  <!-- полноширинный кадр-передышка -->
  <section class="band" data-band="1" aria-hidden="true"></section>

  <!-- ============ 10. RSVP ============ -->
  <section class="section section--rsvp" id="rsvp" data-section="rsvp" data-requires="rsvp.enabled">
    <div class="wrap">
      <header class="head">
        <p class="eyebrow reveal" data-field="rsvp.eyebrow"></p>
        <h2 class="head__title display reveal-lines" data-field="rsvp.title"></h2>
        <p class="head__note reveal" data-field="rsvp.note"></p>
      </header>
      <div class="rsvp__media" data-photo="rsvp.photo"></div>

      <div class="rsvp">
        <form class="form" data-rsvp-form novalidate>
          <div class="form__fields" data-rsvp-fields></div>

          <label class="form__trap" aria-hidden="true">
            Не заполняйте это поле
            <input type="text" name="company" tabindex="-1" autocomplete="off">
          </label>

          <div class="form__foot">
            <button class="btn btn--solid" type="submit" data-rsvp-submit>
              <span class="btn__label" data-field="rsvp.submitLabel"></span>
              <span class="btn__spin" aria-hidden="true"></span>
            </button>
            <p class="form__error" data-rsvp-error role="alert" hidden></p>
          </div>
        </form>

        <div class="thanks" data-rsvp-success hidden>
          <span class="thanks__mark" aria-hidden="true"></span>
          <p class="thanks__title display" data-field="rsvp.success.title"></p>
          <p class="thanks__text" data-field="rsvp.success.text"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 15. ФИНАЛ ============ -->
  <section class="finale" id="finale" data-section="final"
           data-requires="final.text|final.image">
    <div class="finale__media" data-final-media aria-hidden="true"></div>
    <div class="finale__inner">
      <p class="finale__eyebrow" data-field="final.eyebrow"></p>
      <p class="finale__text display" data-field="final.text"></p>
      <p class="finale__sub" data-field="final.sub"></p>
      <span class="finale__rule" aria-hidden="true"></span>
      <p class="finale__names" data-final-names></p>
    </div>
  </section>

</main>

<!-- ============ 16. НАВИГАЦИЯ ============ -->
<nav class="nav" data-nav aria-label="Разделы">
  <div class="nav__sheet" data-nav-sheet hidden>
    <ul class="nav__list" data-nav-list></ul>
  </div>
  <button class="nav__btn" type="button" data-nav-toggle aria-expanded="false" aria-haspopup="true">
    <span class="nav__btn-lines" aria-hidden="true"><i></i><i></i></span>
    <span class="nav__btn-text">Разделы</span>
  </button>
</nav>

<script type="module" src="js/main.js?v=15"></script>
</body>
</html>
